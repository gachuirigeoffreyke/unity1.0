<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMWE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#161719">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Inter";src:url("inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  /* Layout: a control desk. Tracks on an icon rail at the left, working views along the top, glass panels on a quiet field. */
  --bg:#ecedef; --surface:rgba(255,255,255,.74); --solid:#ffffff; --field:#ffffff; --sunk:rgba(20,22,26,.07); --ink:#15171a; --muted:#646a73; --line:rgba(20,22,26,.11);
  --pri:#15171a; --on-pri:#ffffff; --accent:#2f66d0; --on-accent:#ffffff; --good:#1c7a53; --warn:#8a570b; --warn-bg:rgba(214,158,46,.18); --danger:#b3372f;
  --c-sw:#2f66d0; --c-str:#b5622c; --c-ai:#7a4cc2; --c-ent:#1f8a62; --c-rev:#68717c; --c-build:#b8436c;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -18px rgba(20,22,26,.35);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","Ubuntu Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:16px; --rail:64px; --top:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#161719; --surface:rgba(40,41,45,.72); --solid:#232427; --field:rgba(255,255,255,.05); --sunk:rgba(255,255,255,.07); --ink:#f2f3f4; --muted:#9a9fa8; --line:rgba(255,255,255,.09);
    --pri:#ececee; --on-pri:#161719; --accent:#8fb2ff; --on-accent:#10131a; --good:#70d3a5; --warn:#e8bb68; --warn-bg:rgba(232,187,104,.13); --danger:#f08a80;
    --c-sw:#8fb2ff; --c-str:#e39a6b; --c-ai:#b99cf0; --c-ent:#70d3a5; --c-rev:#a3abb5; --c-build:#ee8fb0;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161719; --surface:rgba(40,41,45,.72); --solid:#232427; --field:rgba(255,255,255,.05); --sunk:rgba(255,255,255,.07); --ink:#f2f3f4; --muted:#9a9fa8; --line:rgba(255,255,255,.09);
  --pri:#ececee; --on-pri:#161719; --accent:#8fb2ff; --on-accent:#10131a; --good:#70d3a5; --warn:#e8bb68; --warn-bg:rgba(232,187,104,.13); --danger:#f08a80;
  --c-sw:#8fb2ff; --c-str:#e39a6b; --c-ai:#b99cf0; --c-ent:#70d3a5; --c-rev:#a3abb5; --c-build:#ee8fb0;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -20px rgba(0,0,0,.7);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%;
  background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--c-ai) 13%,transparent),transparent 70%),radial-gradient(760px 520px at 4% 104%,color-mix(in srgb,var(--c-str) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2;letter-spacing:-.015em}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
h3{font-size:16.5px;font-weight:600}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* ---- shell ---- */
.glass{background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:30;display:none;flex-direction:column;gap:4px;padding:12px 10px;border-right:1px solid var(--line);overflow:hidden;transition:width .16s ease;background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.rail:hover,.rail:has(:focus-visible){width:236px;box-shadow:18px 0 40px -24px rgba(0,0,0,.45)}
.ritem{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:0;height:44px;width:100%;text-align:left;color:var(--muted);white-space:nowrap}
.ritem:hover{background:var(--sunk);color:var(--ink)}
.ritem[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.rico{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:12px}
.rico.tc{color:var(--tc)}
.ritem[aria-current="page"] .rico{box-shadow:inset 0 0 0 1.5px var(--tc,var(--line))}
.rlbl{display:flex;flex-direction:column;font-weight:600;font-size:14px;line-height:1.2;opacity:0;transition:opacity .12s}
.rlbl small{font-weight:400;font-size:12px;color:var(--muted)}
.rail:hover .rlbl,.rail:has(:focus-visible) .rlbl{opacity:1}
.rail.shut,.rail.shut:hover{width:var(--rail);box-shadow:none}
.rail.shut .rlbl,.rail.shut:hover .rlbl{opacity:0}
.rsep{height:1px;background:var(--line);margin:6px 4px}
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;font-weight:700;letter-spacing:.16em;font-size:13.5px;padding:6px 4px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--pri);display:grid;place-items:center}
.brand i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-pri)}
.tabs{display:none;gap:2px;margin-left:8px}
.tabs button{display:flex;align-items:center;gap:7px;border:0;background:none;border-radius:10px;padding:8px 12px;color:var(--muted);font-size:14px;font-weight:500}
.tabs button:hover{color:var(--ink);background:var(--sunk)}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--sunk);font-weight:600}
.topmeta{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--muted);font-size:13px}
.wkmeta{display:none;align-items:center;gap:10px;margin-right:6px}
.meter{width:110px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--accent)}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--sunk)}
.ibtn[aria-current="page"]{background:var(--sunk)}
.pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:none;font-weight:600;font-family:var(--mono);font-size:13.5px;color:var(--ink)}
.pill .live{width:8px;height:8px;border-radius:50%;background:var(--good)}
main{display:flex;flex-direction:column;gap:16px;width:100%;max-width:860px;margin:0 auto;padding:18px 16px 96px}
main[data-view="home"],main[data-view="track"],main[data-view="today"]{max-width:1280px}
main[data-view="plan"]{max-width:980px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;border-top:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.bnav button[aria-current="page"]{color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;line-height:17px;font-weight:600;text-align:center}
.bnav .badge{position:absolute;top:3px;left:calc(50% + 6px)}
@media (min-width:900px){
  .rail{display:flex}
  .tabs{display:flex}
  .wkmeta{display:flex}
  .bnav{display:none}
  .app{padding-left:var(--rail)}
  .top{padding:0 24px}
  main{padding:26px 28px 48px}
}

/* ---- parts ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.trk{border-left:3px solid var(--tc,var(--line))}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;color:var(--tc,var(--muted));letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:11.5px;padding:2px 8px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.sug{border-color:transparent;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
.tag.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn);white-space:normal}
.tag.good{color:var(--good);border-color:var(--good)}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--field);border-radius:11px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.btn.lg{padding:12px 22px;font-size:15px;border-radius:13px}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--danger)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--accent));max-width:100%;border-radius:3px}
.banner{border-radius:var(--r);padding:13px 18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.banner.warn{background:var(--warn-bg);border-color:transparent}
.banner.good{border-color:var(--good)}
.lede{color:var(--muted);font-size:14px}
.running{border:1.5px solid var(--tc,var(--accent))}
.clock{font:600 38px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.steps{font-size:12.5px;color:var(--muted)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
.sect h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:stretch}
.cols .row{margin-top:auto}
form.inline{display:flex;gap:8px}
form.inline input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--field);border-radius:11px;padding:9px 11px;width:100%}
select option{background:var(--solid);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
label.check input{width:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* ---- home dashboard ---- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dash>*{grid-column:span 12;min-width:0}
.hero{padding:24px 26px;gap:12px;background:linear-gradient(130deg,color-mix(in srgb,var(--tc,var(--accent)) 24%,transparent),transparent 62%),var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hero h1{max-width:30ch}
@media (max-width:700px){h1{font-size:23px}.hero{padding:20px}}
.tcard{text-align:left;cursor:pointer;font:inherit;color:inherit}
.tcard:hover{border-color:var(--tc)}
.tname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tname svg{color:var(--tc)}
.big{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.big small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.025em}
.stat span{font-size:12.5px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:380px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--sunk)}
.heat .l1{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.heat .l2{background:color-mix(in srgb,var(--accent) 52%,transparent)}
.heat .l3{background:color-mix(in srgb,var(--accent) 76%,transparent)}
.heat .l4{background:var(--accent)}
.heat .fut{opacity:.35}
.heat .now{box-shadow:0 0 0 1.5px var(--ink)}
.arow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.arow:first-of-type{border-top:0}
@media (min-width:700px){.dash>.tcard{grid-column:span 6}}
@media (min-width:1100px){
  .dash>.hero{grid-column:span 7}.dash>.wk{grid-column:span 5}
  .dash>.tcard{grid-column:span 3}
  .dash>.cons{grid-column:span 7}.dash>.attn{grid-column:span 5}
}

/* ---- week ---- */
.wkrow{display:grid;grid-template-columns:128px 1fr 96px;gap:10px;align-items:center;font-size:14px}
.wkrow .bar{height:8px;border-radius:4px}
.wkrow .r{text-align:right;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11.5px;color:var(--muted)}
.day i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--accent);min-height:2px}
.day.today b{color:var(--ink);font-weight:700}
.day b{font-weight:500}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-child{border-top:0}

/* ---- plan and queues ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:16px;padding:6px 13px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.grp>summary{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
details.grp>summary span{color:var(--muted);font-weight:400;white-space:nowrap}
details.item{border-top:1px solid var(--line)}
details.item>summary{list-style:none;cursor:pointer;padding:10px 16px;display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;align-items:baseline}
details.item>summary::-webkit-details-marker{display:none}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--tc);align-self:center}
.st-done .dot{background:var(--tc)} .st-done .ttl{color:var(--muted);text-decoration:line-through}
.st-later .ttl{color:var(--muted)} .st-later .dot{border-style:dotted}
.item .sub{grid-column:2 / -1;color:var(--muted);font-size:12.5px;display:flex;gap:4px 10px;flex-wrap:wrap}
.item .acts{padding:4px 16px 12px 38px;display:flex;flex-direction:column;gap:8px}
.idea{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:0}
.prow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.prow:first-child{border-top:0}
.prow input[type=checkbox]{margin-top:4px;width:17px;height:17px}
.prow input[type=text]{grid-column:2;font-size:13px;padding:6px 9px}
.done-t{color:var(--muted);text-decoration:line-through}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--solid);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(10,12,16,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h2{font-size:20px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--pri);color:var(--on-pri);padding:9px 15px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast,.rail,.rlbl{transition:none}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* ===== 1.2: two layers. Outer field holds the name and the rail; the inner panel holds everything else. ===== */
:root{--outer:linear-gradient(155deg,#d6dce8 0%,#e5e1dc 52%,#e4d6c2 100%);--inner:rgba(255,255,255,.44);--card:#ffffff;--railw:76px;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 14px 30px -22px rgba(20,22,26,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--outer:linear-gradient(155deg,#0e0f11 0%,#131417 55%,#17130e 100%);--inner:rgba(255,255,255,.045);--card:#25262a;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 32px -24px rgba(0,0,0,.85)}}
:root[data-theme="dark"]{--outer:linear-gradient(155deg,#0e0f11 0%,#131417 55%,#17130e 100%);--inner:rgba(255,255,255,.045);--card:#25262a;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 32px -24px rgba(0,0,0,.85)}
[hidden]{display:none !important}
body{background:radial-gradient(900px 520px at 92% -6%,color-mix(in srgb,var(--c-ai) 16%,transparent),transparent 70%),radial-gradient(760px 520px at 0% 100%,color-mix(in srgb,var(--c-str) 16%,transparent),transparent 70%),var(--outer);background-attachment:fixed}
.card,.stat,details.grp{background:var(--card)}
.banner:not(.warn){background:var(--card)}
.top{border-bottom:0}
main[data-view="home"]{max-width:1440px}
.ibtn{position:relative}
.ibtn .badge{position:absolute;top:-6px;right:-6px}
.rbrand{display:none}
.attn-panel{position:fixed;top:24px;right:24px;bottom:24px;width:min(390px,calc(100vw - 48px));z-index:35;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:-24px 0 70px -34px rgba(0,0,0,.55);padding:18px 20px;display:flex;flex-direction:column;gap:4px;overflow:auto;animation:slidein .18s ease}
@keyframes slidein{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.attn-panel{animation:none}.app{transition:none !important}}

/* home */
.hero{min-height:310px;background:linear-gradient(130deg,color-mix(in srgb,var(--tc,var(--accent)) 20%,var(--card)),var(--card) 64%);-webkit-backdrop-filter:none;backdrop-filter:none}
.after{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.nx{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.nx i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}

/* ===== 1.5: Plan page: folder tabs, three-view summary, stage board ===== */

.rd-main{padding:0;gap:0;min-width:0}
.rd-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:20px 20px 0 0;z-index:2}
.rt{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);min-width:0}
.rt b{font:600 17px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}

.rt.on i{background:var(--good)}
.rd-item{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.rd-foot{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.prose{padding:22px 26px 30px;font-size:16px;line-height:1.68;max-width:86ch;width:100%;margin:0 auto;overflow-wrap:break-word}
.prose>*:first-child{margin-top:0}
.prose h1{font-size:28px;letter-spacing:-.02em;margin:0 0 14px;line-height:1.2}
.prose h2{font-size:25px;margin:0 0 14px;line-height:1.22}
.prose h3{font-size:18.5px;margin:30px 0 8px}
.prose h4{font-size:16px;margin:22px 0 6px}
.prose p,.prose ul,.prose ol,.prose blockquote,.prose pre,.prose details,.prose .tblw{margin:0 0 14px}

.prose pre code{background:none;padding:0;font-size:inherit}
.prose blockquote{border-left:3px solid var(--line);padding:2px 0 2px 14px;color:var(--muted)}
.prose blockquote>*:last-child{margin-bottom:0}
.prose hr{margin:22px 0}
.prose .tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.prose table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.prose th,.prose td{padding:8px 11px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.prose thead th{border-top:0;background:var(--sunk);font-weight:600;white-space:nowrap}
.prose details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.prose details[open]{padding-bottom:2px}
.prose summary{cursor:pointer;font-weight:500}
.prose details[open]>summary{margin-bottom:10px}
.prose math{font-size:1.1em}
.prose .mathw{margin:0 0 14px;overflow-x:auto;overflow-y:hidden;padding:4px 0}

.prose input[type=checkbox]{width:auto;margin-right:6px}
.prose img{max-width:100%}
@media (min-width:1100px){
  main[data-view="library"],main[data-view="read"]{max-width:none}

  .rd{grid-template-columns:290px minmax(0,1fr)}

}
@media (min-width:900px){.rd-bar{top:66px}.tabs button{padding:7px 10px}}
@media (max-width:1400px){.pill~.wkmeta{display:none}}

@media (max-width:600px){.prose{padding:16px 15px 24px;font-size:15.5px}.rd-bar,.rd-item,.rd-foot{padding-left:14px;padding-right:14px}.bnav button{font-size:10.5px}}

@media (max-width:899px){.nophone{display:none}}

/* ===== 2.1: Library with an overview tab, a tab per track, and nested stages > volumes > lessons ===== */
.lv{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
.lv>section{display:flex;flex-direction:column;gap:12px;min-width:0}
.lv .sect-h{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:30px}
.lstage{border-radius:16px;background:var(--sunk);padding:6px}
.lstage>summary,.lvol>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center}
.lstage>summary::-webkit-details-marker,.lvol>summary::-webkit-details-marker{display:none}
.lstage>summary{padding:9px 10px;font-weight:700;font-size:14.5px}
.lstage>summary .meta,.lvol>summary .meta{font-weight:400;white-space:nowrap}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;justify-self:center}
details[open]>summary>.chev{transform:rotate(45deg)}
.lstage.cur>summary{box-shadow:inset 3px 0 0 var(--tc);border-radius:4px}
.lvols{display:flex;flex-direction:column;gap:6px;padding:2px 0 0}
.lvol{background:var(--card);border:1px solid var(--line);border-radius:13px}
.lvol>summary{padding:11px 13px}
.lvol .vt{display:flex;flex-direction:column;gap:5px;min-width:0}
.lvol .vt b{font-size:14.5px;font-weight:600}
.lvol .vt .bar{max-width:260px}
.lvol .vbody{padding:0 13px 12px 39px;display:flex;flex-direction:column;gap:6px}
.lv .tgrid{flex:none}
@media (min-width:1000px){.lv.home{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}
@media (max-width:600px){.lvol .vbody{padding-left:13px}.lvol>summary .meta{display:none}}

/* ===== 3.0: cards and spaced review ===== */
.cform{display:flex;flex-direction:column;gap:10px}
.cform textarea{min-height:64px}
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.crow .q{min-width:0}
.crow .q .meta{display:block;font-size:12.5px}
.cfilt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cfilt input[type=text]{flex:1 1 180px;width:auto}
.cfilt .seg button{padding:5px 10px}
.rvwrap{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.fc{padding:0;gap:0;overflow:hidden}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}

.fc .prose{padding:22px 24px;font-size:17px;max-width:none;min-height:110px}

.fc-act{display:flex;flex-direction:column;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px}
.rate .btn small{font-size:11.5px;color:var(--muted);font-weight:400}
.rate .btn.pri small{color:inherit;opacity:.75}
.rvdone{align-items:center;text-align:center;padding:38px 24px;gap:12px}
.kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
@media (min-width:1100px){main[data-view="review"]{max-width:none}}

/* ---------- storage: IndexedDB, then localStorage, then memory ---------- */
const DB = {
  db: null, mode: "memory",
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open("unity", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { this.db = r.result; this.mode = "device database"; res(); };
        r.onerror = () => res(); r.onblocked = () => res();
      } catch (e) { res(); }
    });
  },
  get() {
    return new Promise(res => {
      if (this.db) {
        try {
          const q = this.db.transaction("kv").objectStore("kv").get("state");
          q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
        } catch (e) { res(null); }
      } else {
        try { const v = localStorage.getItem("unity.state"); if (v) this.mode = "browser storage"; res(v ? JSON.parse(v) : null); }
        catch (e) { res(null); }
      }
    });
  },
  getK(k) {
    return new Promise(res => {
      if (this.db) { try { const q = this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }
      else { try { const v = localStorage.getItem("unity.k." + k); res(v ? JSON.parse(v) : null); } catch (e) { res(null); } }
    });
  },
  putK(k, v) {
    if (this.db) { try { this.db.transaction("kv", "readwrite").objectStore("kv").put(v, k); return true; } catch (e) { /* fall through */ } }
    try { localStorage.setItem("unity.k." + k, JSON.stringify(v)); return true; } catch (e) { return false; }
  },
  put(v) {
    if (this.db) { try { this.db.transaction("kv", "readwrite").objectStore("kv").put(v, "state"); return; } catch (e) { /* fall through */ } }
    try { localStorage.setItem("unity.state", JSON.stringify(v)); this.mode = "browser storage"; } catch (e) { this.mode = "memory"; }
  }
};

function trackStats(trId) {

  const oldest = parked.length ? Math.max(...parked.map(age)) : 0;
  const head = `<div class="today-head">${sketch("bulb")}<div class="th-text"><h2>Ideas</h2><p class="lede">Every new idea lands here first. It stays safe, and the plan stays intact until you decide.</p></div></div>`;

  "off-plan"() {
    openDlg(`<h2>Something not on the plan</h2><p class="lede">Fine to do. Name it so the week shows where the time went. If it can wait, park it instead.</p>
      <label>What is it?<input type="text" name="label" id="op-l" required maxlength="120"></label>
      <label>Closest track<select name="tr" id="op-tr">${trackOpts("sw")}</select></label>
      <div class="row"><button class="btn pri" type="submit" name="go" value="start">Start the session</button><button class="btn" type="submit" name="go" value="park">Park it instead</button><button class="btn quiet" type="button" data-act="dlg-close">Cancel</button></div>`,
      (d, f) => {
        if (d.go === "park") { S.ideas.push(touch({ id: uid("I"), ts: Date.now(), text: d.label.trim(), st: "parked" })); save(); toast("Parked"); }
        else { closeDlg(); startTimer(d.tr, null, d.label.trim(), true); return false; }
      });
  },
  "open-plan"(el) { ACT.track(el); },
  track(el) { if (el.closest("#rail")) $("#rail").classList.add("shut"); S.planTrack = el.dataset.tr; S.view = "track"; UI.touchedG = false; UI.openI = null; save(); render(); toTop(); },
  "wk-nav"(el) { const d = +el.dataset.dir; UI.wkOff = d === 0 ? 0 : Math.max(0, (UI.wkOff || 0) + d); render(); },
  "plan-view"(el) { UI.planView = el.dataset.v; render(); },
  "col-toggle"(el) {
    const k = el.dataset.k, shut = el.getAttribute("aria-expanded") === "false";
    UI.colShut = UI.colShut || new Set(); UI.colOpen = UI.colOpen || new Set();
    if (shut) { UI.colOpen.add(k); UI.colShut.delete(k); } else { UI.colShut.add(k); UI.colOpen.delete(k); }
    render();
  },
  "copy-outline"() { const t = outlineMd(S.planTrack || "sw"); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Outline copied")).catch(() => toast("Copy was blocked by the browser.")); },
  attn() { UI.attn = !UI.attn; render(); },
  "attn-go"(el) { UI.attn = false; if (el.dataset.tr) ACT.track(el); else ACT.view(el); },
  theme() { const o = ["auto", "light", "dark"]; S.settings.theme = o[(o.indexOf(S.settings.theme || "auto") + 1) % 3]; save(); render(); toast("Theme: " + S.settings.theme); },
  "quick-idea"() {
    openDlg(`<h2>Park an idea</h2><label>In one line<input type="text" name="text" id="qi-t" required maxlength="300" autofocus></label>
      <div class="row"><button class="btn pri" type="submit">Park</button><button class="btn" type="button" data-act="dlg-close">Cancel</button></div>`, d => { FORMS.capture(d); });
  },
  "plan-track"(el) { S.planTrack = el.dataset.tr; UI.touchedG = false; UI.openI = null; save(); render(); },
  "add-item"() { editItemDlg(null); },
  "item-edit"(el) { editItemDlg(item(el.dataset.it)); },
  "item-remove"(el) { const i = item(el.dataset.it); if (i) { i.st = "removed"; touch(i); save(); } closeDlg(); render(); },
  "item-done"(el) { const i = item(el.dataset.it); if (!i) return; i.st = "done"; i.doneAt = todayIso(); touch(i); save(); render(); toast("Done. Next item is up."); },
  "item-reopen"(el) { const i = item(el.dataset.it); if (!i) return; i.st = "open"; touch(i); save(); render(); },
  "item-aside"(el) { const i = item(el.dataset.it); if (!i) return; i.st = "later"; touch(i); save(); render(); toast("Set aside. It stays in the plan."); },
  "item-top"(el) { const i = item(el.dataset.it), op = openItems(i.tr); if (op[0] && op[0].id !== i.id) { i.o = op[0].o - 5; touch(i); save(); } render(); toast("Moved to the top"); },
  "item-move"(el) {
    const i = item(el.dataset.it), op = openItems(i.tr), k = op.findIndex(x => x.id === i.id), j = k + (+el.dataset.dir);
    if (k < 0 || j < 0 || j >= op.length) return;
    const o = op[j].o; op[j].o = i.o; i.o = o; touch(i); touch(op[j]); save(); render();
  },
  "idea-promote"(el) { ideaDecide(el.dataset.id, "promote"); },
  "idea-schedule"(el) { ideaDecide(el.dataset.id, "schedule"); },
  "idea-drop"(el) { const i = S.ideas.find(x => x.id === el.dataset.id); i.st = "dropped"; touch(i); save(); render(); },
  "idea-restore"(el) { const i = S.ideas.find(x => x.id === el.dataset.id); i.st = "parked"; touch(i); save(); render(); },
  "crit-del"(el) { const c = S.criteria.find(x => x.id === el.dataset.id); c.del = 1; touch(c); save(); render(); },
  "del-session"(el) { if (!arm(el.dataset.id)) return; const s = S.sessions.find(x => x.id === el.dataset.id); s.del = 1; touch(s); save(); render(); },
  "reopen-week"() { delete S.reviews[viewWk()]; save(); render(); },
  "end-pause"() { if (S.pause) { const p = S.pause, y = addDays(todayIso(), -1); S.pauses.push({ ...p, until: p.until < todayIso() ? p.until : y }); S.pause = null; save(); render(); toast("Full plan resumed"); } },
  export() { download(`unity-backup-${todayIso()}.json`, backupText(), "application/json"); S.lastExport = Date.now(); save(); render(); },
  "export-csv"() {
    const rows = [["event_id", "type", "ref_id", "track", "title", "date", "hours", "ai_mode", "off_plan", "note"]];
    live().slice().sort((a, b) => a.ts - b.ts).forEach((s, n) => rows.push(["UNI.EVT-" + String(n + 1).padStart(6, "0"), "study_session", s.it || "", s.tr, sessionLabel(s), s.d, (s.m / 60).toFixed(2), s.mode ?? "", s.off ? "yes" : "", s.note || ""]));
    download(`unity-sessions-${todayIso()}.csv`, rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
  },
  "copy-backup"() { const t = backupText(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Backup copied")).catch(() => toast("Copy was blocked. Use Export backup.")); },
  import(el) {
    const f = $("#imp-file").files[0], mode = el.dataset.mode; if (!f) { toast("Choose a backup file first."); return; }
    if (mode === "replace" && !arm("replace")) return;
    const r = new FileReader(); r.onload = () => { try { importData(JSON.parse(r.result), mode); } catch (e) { toast("That file could not be read."); } }; r.readAsText(f);
  },
  persist() { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => toast(ok ? "The browser will keep this data." : "Not granted. Install the app, and keep exporting backups.")); else toast("Not supported in this browser."); },
  reset() { if (!arm("reset")) return; S = fresh(); save(); render(); toast("Plan reloaded"); }
};
document.addEventListener("click", e => {
  const a = e.target.closest("#lesson a[data-in]"); if (!a) return; e.preventDefault();
  const p = readPos(), slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, ""), want = slug(a.textContent || "");
  const k = p && want ? p.v.secs.findIndex(x => { const s2 = slug((x.mod ? x.mod : "") + x.t), s3 = slug(x.t); return s2 === want || s3 === want || (want.length > 5 && (s3.startsWith(want) || want.endsWith(s3))); }) : -1;
  if (k >= 0) openLesson(p.v.id, k);
});
document.addEventListener("toggle", e => { const t = e.target; if (!t.classList) return; if (t.classList.contains("rd-toc")) UI.tocOpen = t.open; if (t.dataset && t.dataset.lib) { UI.libSet = UI.libSet || {}; UI.libSet[t.dataset.lib] = t.open; } }, true);
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el) return; const fn = ACT[el.dataset.act]; if (fn) { if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault(); fn(el, e); } });
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset && el.dataset.chg; if (!k) return;
  if (k === "show-done") { UI.showDone = el.checked; render(); }
  else if (k === "past-track") { $("#p-it").innerHTML = itemOpts(el.value); }
  else if (k === "idea-track") { const g = $("#id-gave"); if (g && UI.giveOpts) g.innerHTML = UI.giveOpts(el.value); }
  else if (k === "proof-done") { const p = S.proofs.find(x => x.id === el.dataset.id); p.done = el.checked ? 1 : 0; touch(p); save(); render(); }
  else if (k === "proof-ev") { const p = S.proofs.find(x => x.id === el.dataset.id); p.ev = el.value.trim(); touch(p); save(); }
  else if (k === "crit-done") { const c = S.criteria.find(x => x.id === el.dataset.id); c.done = el.checked ? 1 : 0; touch(c); save(); render(); }
});
document.addEventListener("toggle", e => {
  const el = e.target; if (!el.matches) return;
  if (el.matches("details.grp")) { const k = el.dataset.g; if (el.open === UI.openG.has(k)) return; UI.touchedG = true; el.open ? UI.openG.add(k) : UI.openG.delete(k); render(); }
  else if (el.matches("details.item")) { const id = el.dataset.i; if (el.open && UI.openI !== id) { UI.openI = id; render(); } else if (!el.open && UI.openI === id) { UI.openI = null; render(); } }
}, true);
$("#dlg").addEventListener("cancel", () => { dlgSubmit = null; });
$("#rail").addEventListener("mouseleave", () => $("#rail").classList.remove("shut"));
document.addEventListener("visibilitychange", () => {
  if (!S) return;
  if (document.hidden) { if (S.rt && S.rt.start) rtPause("hidden"); clearTimeout(saveT); DB.put(S); }
  else if (S.view === "read") { lastAct = Date.now(); if (S.rt && !S.rt.start && S.rt.why === "hidden") { S.rt.start = Date.now(); S.rt.why = ""; } renderNav(); rtTick(); }
  else render();
});
for (const ev of ["pointerdown", "keydown", "wheel", "touchmove"]) document.addEventListener(ev, noteAct, { passive: true });
document.addEventListener("scroll", noteAct, { passive: true, capture: true });

/* ---------- boot ---------- */
(async function boot() {
  await DB.open();
  const prev = await DB.get();
  S = prev && Array.isArray(prev.items) ? prev : fresh();
  if (!prev) DB.put(S);
  // New seed items added in a later version are appended without touching existing data.
  migrate();
  if (S.rt && S.rt.start) { S.rt.start = null; S.rt.why = "left"; }
  loadVols();
  const have = new Set(S.items.map(i => i.id));
  for (const x of SEED.items) if (!have.has(x.id)) S.items.push({ ...x, u: 0 });
  for (const tr of SEED.tracks) if (!(tr.id in S.settings.targets)) S.settings.targets[tr.id] = tr.target;
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
