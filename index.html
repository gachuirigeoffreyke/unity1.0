<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMWE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#161719">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Inter";src:url("inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  /* Layout: a control desk. Tracks on an icon rail at the left, working views along the top, glass panels on a quiet field. */
  --bg:#ecedef; --surface:rgba(255,255,255,.74); --solid:#ffffff; --field:#ffffff; --sunk:rgba(20,22,26,.07); --ink:#15171a; --muted:#646a73; --line:rgba(20,22,26,.11);
  --pri:#15171a; --on-pri:#ffffff; --accent:#2f66d0; --on-accent:#ffffff; --good:#1c7a53; --warn:#8a570b; --warn-bg:rgba(214,158,46,.18); --danger:#b3372f;
  --c-sw:#2f66d0; --c-str:#b5622c; --c-ai:#7a4cc2; --c-ent:#1f8a62; --c-rev:#68717c; --c-build:#b8436c;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -18px rgba(20,22,26,.35);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","Ubuntu Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:16px; --rail:64px; --top:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#161719; --surface:rgba(40,41,45,.72); --solid:#232427; --field:rgba(255,255,255,.05); --sunk:rgba(255,255,255,.07); --ink:#f2f3f4; --muted:#9a9fa8; --line:rgba(255,255,255,.09);
    --pri:#ececee; --on-pri:#161719; --accent:#8fb2ff; --on-accent:#10131a; --good:#70d3a5; --warn:#e8bb68; --warn-bg:rgba(232,187,104,.13); --danger:#f08a80;
    --c-sw:#8fb2ff; --c-str:#e39a6b; --c-ai:#b99cf0; --c-ent:#70d3a5; --c-rev:#a3abb5; --c-build:#ee8fb0;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161719; --surface:rgba(40,41,45,.72); --solid:#232427; --field:rgba(255,255,255,.05); --sunk:rgba(255,255,255,.07); --ink:#f2f3f4; --muted:#9a9fa8; --line:rgba(255,255,255,.09);
  --pri:#ececee; --on-pri:#161719; --accent:#8fb2ff; --on-accent:#10131a; --good:#70d3a5; --warn:#e8bb68; --warn-bg:rgba(232,187,104,.13); --danger:#f08a80;
  --c-sw:#8fb2ff; --c-str:#e39a6b; --c-ai:#b99cf0; --c-ent:#70d3a5; --c-rev:#a3abb5; --c-build:#ee8fb0;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -20px rgba(0,0,0,.7);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%;
  background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--c-ai) 13%,transparent),transparent 70%),radial-gradient(760px 520px at 4% 104%,color-mix(in srgb,var(--c-str) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2;letter-spacing:-.015em}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
h3{font-size:16.5px;font-weight:600}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* ---- shell ---- */
.glass{background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:30;display:none;flex-direction:column;gap:4px;padding:12px 10px;border-right:1px solid var(--line);overflow:hidden;transition:width .16s ease;background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.rail:hover,.rail:has(:focus-visible){width:236px;box-shadow:18px 0 40px -24px rgba(0,0,0,.45)}
.ritem{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:0;height:44px;width:100%;text-align:left;color:var(--muted);white-space:nowrap}
.ritem:hover{background:var(--sunk);color:var(--ink)}
.ritem[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.rico{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:12px}
.rico.tc{color:var(--tc)}
.ritem[aria-current="page"] .rico{box-shadow:inset 0 0 0 1.5px var(--tc,var(--line))}
.rlbl{display:flex;flex-direction:column;font-weight:600;font-size:14px;line-height:1.2;opacity:0;transition:opacity .12s}
.rlbl small{font-weight:400;font-size:12px;color:var(--muted)}
.rail:hover .rlbl,.rail:has(:focus-visible) .rlbl{opacity:1}
.rail.shut,.rail.shut:hover{width:var(--rail);box-shadow:none}
.rail.shut .rlbl,.rail.shut:hover .rlbl{opacity:0}
.rsep{height:1px;background:var(--line);margin:6px 4px}
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;font-weight:700;letter-spacing:.16em;font-size:13.5px;padding:6px 4px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--pri);display:grid;place-items:center}
.brand i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-pri)}
.tabs{display:none;gap:2px;margin-left:8px}
.tabs button{display:flex;align-items:center;gap:7px;border:0;background:none;border-radius:10px;padding:8px 12px;color:var(--muted);font-size:14px;font-weight:500}
.tabs button:hover{color:var(--ink);background:var(--sunk)}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--sunk);font-weight:600}
.topmeta{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--muted);font-size:13px}
.wkmeta{display:none;align-items:center;gap:10px;margin-right:6px}
.meter{width:110px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--accent)}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--sunk)}
.ibtn[aria-current="page"]{background:var(--sunk)}
.pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:none;font-weight:600;font-family:var(--mono);font-size:13.5px;color:var(--ink)}
.pill .live{width:8px;height:8px;border-radius:50%;background:var(--good)}
main{display:flex;flex-direction:column;gap:16px;width:100%;max-width:860px;margin:0 auto;padding:18px 16px 96px}
main[data-view="home"],main[data-view="track"],main[data-view="today"]{max-width:1280px}
main[data-view="plan"]{max-width:980px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;border-top:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.bnav button[aria-current="page"]{color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;line-height:17px;font-weight:600;text-align:center}
.bnav .badge{position:absolute;top:3px;left:calc(50% + 6px)}
@media (min-width:900px){
  .rail{display:flex}
  .tabs{display:flex}
  .wkmeta{display:flex}
  .bnav{display:none}
  .app{padding-left:var(--rail)}
  .top{padding:0 24px}
  main{padding:26px 28px 48px}
}

/* ---- parts ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.trk{border-left:3px solid var(--tc,var(--line))}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;color:var(--tc,var(--muted));letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:11.5px;padding:2px 8px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.sug{border-color:transparent;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
.tag.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn);white-space:normal}
.tag.good{color:var(--good);border-color:var(--good)}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--field);border-radius:11px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
.btn.lg{padding:12px 22px;font-size:15px;border-radius:13px}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--danger)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--accent));max-width:100%;border-radius:3px}
.banner{border-radius:var(--r);padding:13px 18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.banner.warn{background:var(--warn-bg);border-color:transparent}
.banner.good{border-color:var(--good)}
.lede{color:var(--muted);font-size:14px}
.running{border:1.5px solid var(--tc,var(--accent))}
.clock{font:600 38px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.steps{font-size:12.5px;color:var(--muted)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
.sect h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:stretch}
.cols .row{margin-top:auto}
form.inline{display:flex;gap:8px}
form.inline input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--field);border-radius:11px;padding:9px 11px;width:100%}
select option{background:var(--solid);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
label.check input{width:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* ---- home dashboard ---- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dash>*{grid-column:span 12;min-width:0}
.hero{padding:24px 26px;gap:12px;background:linear-gradient(130deg,color-mix(in srgb,var(--tc,var(--accent)) 24%,transparent),transparent 62%),var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hero h1{max-width:30ch}
@media (max-width:700px){h1{font-size:23px}.hero{padding:20px}}
.tcard{text-align:left;cursor:pointer;font:inherit;color:inherit}
.tcard:hover{border-color:var(--tc)}
.tname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tname svg{color:var(--tc)}
.big{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.big small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.025em}
.stat span{font-size:12.5px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:380px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--sunk)}
.heat .l1{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.heat .l2{background:color-mix(in srgb,var(--accent) 52%,transparent)}
.heat .l3{background:color-mix(in srgb,var(--accent) 76%,transparent)}
.heat .l4{background:var(--accent)}
.heat .fut{opacity:.35}
.heat .now{box-shadow:0 0 0 1.5px var(--ink)}
.arow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.arow:first-of-type{border-top:0}
@media (min-width:700px){.dash>.tcard{grid-column:span 6}}
@media (min-width:1100px){
  .dash>.hero{grid-column:span 7}.dash>.wk{grid-column:span 5}
  .dash>.tcard{grid-column:span 3}
  .dash>.cons{grid-column:span 7}.dash>.attn{grid-column:span 5}
}

/* ---- week ---- */
.wkrow{display:grid;grid-template-columns:128px 1fr 96px;gap:10px;align-items:center;font-size:14px}
.wkrow .bar{height:8px;border-radius:4px}
.wkrow .r{text-align:right;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11.5px;color:var(--muted)}
.day i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--accent);min-height:2px}
.day.today b{color:var(--ink);font-weight:700}
.day b{font-weight:500}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-child{border-top:0}

/* ---- plan and queues ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:16px;padding:6px 13px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:600}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.grp>summary{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
details.grp>summary span{color:var(--muted);font-weight:400;white-space:nowrap}
details.item{border-top:1px solid var(--line)}
details.item>summary{list-style:none;cursor:pointer;padding:10px 16px;display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;align-items:baseline}
details.item>summary::-webkit-details-marker{display:none}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--tc);align-self:center}
.st-done .dot{background:var(--tc)} .st-done .ttl{color:var(--muted);text-decoration:line-through}
.st-later .ttl{color:var(--muted)} .st-later .dot{border-style:dotted}
.item .sub{grid-column:2 / -1;color:var(--muted);font-size:12.5px;display:flex;gap:4px 10px;flex-wrap:wrap}
.item .acts{padding:4px 16px 12px 38px;display:flex;flex-direction:column;gap:8px}
.idea{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:0}
.prow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.prow:first-child{border-top:0}
.prow input[type=checkbox]{margin-top:4px;width:17px;height:17px}
.prow input[type=text]{grid-column:2;font-size:13px;padding:6px 9px}
.done-t{color:var(--muted);text-decoration:line-through}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--solid);color:var(--ink);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(10,12,16,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h2{font-size:20px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--pri);color:var(--on-pri);padding:9px 15px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast,.rail,.rlbl{transition:none}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* ===== 1.2: two layers. Outer field holds the name and the rail; the inner panel holds everything else. ===== */
:root{--outer:linear-gradient(155deg,#d6dce8 0%,#e5e1dc 52%,#e4d6c2 100%);--inner:rgba(255,255,255,.44);--card:#ffffff;--railw:76px;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 14px 30px -22px rgba(20,22,26,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--outer:linear-gradient(155deg,#0e0f11 0%,#131417 55%,#17130e 100%);--inner:rgba(255,255,255,.045);--card:#25262a;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 32px -24px rgba(0,0,0,.85)}}
:root[data-theme="dark"]{--outer:linear-gradient(155deg,#0e0f11 0%,#131417 55%,#17130e 100%);--inner:rgba(255,255,255,.045);--card:#25262a;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 32px -24px rgba(0,0,0,.85)}
[hidden]{display:none !important}
body{background:radial-gradient(900px 520px at 92% -6%,color-mix(in srgb,var(--c-ai) 16%,transparent),transparent 70%),radial-gradient(760px 520px at 0% 100%,color-mix(in srgb,var(--c-str) 16%,transparent),transparent 70%),var(--outer);background-attachment:fixed}
.card,.stat,details.grp{background:var(--card)}
.banner:not(.warn){background:var(--card)}
.top{border-bottom:0}
main[data-view="home"]{max-width:1440px}
.ibtn{position:relative}
.ibtn .badge{position:absolute;top:-6px;right:-6px}
.rbrand{display:none}
.attn-panel{position:fixed;top:24px;right:24px;bottom:24px;width:min(390px,calc(100vw - 48px));z-index:35;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:-24px 0 70px -34px rgba(0,0,0,.55);padding:18px 20px;display:flex;flex-direction:column;gap:4px;overflow:auto;animation:slidein .18s ease}
@keyframes slidein{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.attn-panel{animation:none}.app{transition:none !important}}

/* home */
.hero{min-height:310px;background:linear-gradient(130deg,color-mix(in srgb,var(--tc,var(--accent)) 20%,var(--card)),var(--card) 64%);-webkit-backdrop-filter:none;backdrop-filter:none}
.after{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.nx{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.nx i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.tmini{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:color-mix(in srgb,var(--tc) 6%,transparent);font:inherit;color:inherit;min-width:0}
.tmini:hover{border-color:var(--tc)}
.tmini .big{font-size:27px}
.rq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
.rev .row{margin-top:auto}
@media (min-width:700px){.dash>.wk,.dash>.rev{grid-column:span 6}}
@media (min-width:1100px){
  .dash>.hero{grid-column:span 7}.dash>.tracks{grid-column:span 5}
  .dash>.cons{grid-column:span 5}.dash>.wk{grid-column:span 4}.dash>.rev{grid-column:span 3}
}

@media (min-width:900px){
  body{overflow:hidden}
  .app{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);height:100vh;padding-left:0;transition:grid-template-columns .2s ease .06s}
  .app:has(.rail:hover:not(.shut)),.app:has(.rail :focus-visible){--railw:236px}
  .app .rail,.app .rail:hover{position:relative;left:auto;top:auto;bottom:auto;width:auto;height:100vh;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:none;padding:16px 14px;gap:6px}
  .rbrand{display:flex;flex-direction:column;align-items:center;gap:1px;width:48px;border:0;background:none;padding:0;margin-bottom:14px;color:var(--ink)}
  .rbrand i{position:relative;width:48px;height:44px;flex:none}
  .rbrand i::before{content:"";position:absolute;left:7px;top:5px;width:34px;height:34px;border-radius:11px;background:var(--pri)}
  .rbrand i::after{content:"";position:absolute;left:19px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--on-pri)}
  .rbrand b{font-size:9.5px;font-weight:700;letter-spacing:.2em;padding-left:.2em}
  .ritem{width:100%}
  .ritem:hover,.ritem[aria-current="page"]{background:var(--inner)}
  .inner{margin:12px 12px 12px 0;height:calc(100vh - 24px);border-radius:26px;background:var(--inner);border:1px solid var(--line);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);overflow-y:auto;overflow-x:hidden}
  .top{background:none;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:0 26px;height:66px;border-radius:26px 26px 0 0}
  .top .brand{display:none}
  .tabs{margin-left:0}
  main{padding:10px 26px 40px}
}
@media (min-width:1100px){
  main[data-view="home"]{max-width:none}
  .dash{min-height:calc(100vh - 142px);grid-template-rows:minmax(min-content,1.25fr) minmax(min-content,1fr)}
  .heat{max-width:470px}
  .hero h1{font-size:34px}
}

/* ===== 1.3: centred top bar, Today page, topic icons ===== */
.eyebrow{display:flex;align-items:center;gap:7px}
.today-head{display:flex;gap:20px;align-items:center}
.cal{flex:none;width:104px;height:114px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.cal-m{width:100%;text-align:center;background:#d24b3e;color:#fff;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:5px 0 4px}
.cal-d{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.08;margin-top:5px}
.cal-w{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.th-text{display:flex;flex-direction:column;gap:6px;min-width:0}
.th-text h2{font-size:30px}
.th-text .hint{font-size:14px;color:var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}
.today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.nu-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;flex:1}
.tgroup{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:700px){.tgroup{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card.tk{box-shadow:none;border-radius:15px;background:color-mix(in srgb,var(--tc) 6%,transparent);padding:15px 16px;gap:8px}
.tk h3{font-size:15.5px}
.tk .row{margin-top:auto;padding-top:4px}
.tk .chip{display:flex;align-items:center;gap:6px}
.bulb{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn);flex:none}
.irow{font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.ideas-p .tail{margin-top:auto;display:flex;flex-direction:column;gap:2px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
@media (min-width:800px){.nu-grid{grid-template-columns:minmax(0,1fr) 250px}}
@media (min-width:900px){
  .top{display:grid;grid-template-columns:1fr auto 1fr}
  .tabs{grid-column:2}
  .topmeta{grid-column:3}
}
@media (min-width:1100px){
  main[data-view="today"]{max-width:none;min-height:calc(100vh - 92px)}
  .today-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
}
@media (max-width:600px){.cal{width:84px;height:96px}.cal-d{font-size:36px}.th-text h2{font-size:23px}}

/* ===== 1.4: hand-drawn illustrations, Week page ===== */
.sk{position:relative;flex:none;width:66px;height:66px;color:var(--ink)}
.sk svg{width:100%;height:100%;overflow:visible;display:block}
.sk-m{position:absolute;left:0;right:0;top:14.5px;text-align:center;font-size:8px;font-weight:700;letter-spacing:.18em;padding-left:.18em;color:#fff;text-transform:uppercase;line-height:1}
.sk-d{position:absolute;left:0;right:0;top:27px;text-align:center;font-size:23px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.today-head{gap:16px}
.wkpage>*{grid-column:span 12}
.dstack{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;flex:1;min-height:200px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--muted)}
.dwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:120px;border-radius:9px;background:var(--sunk)}
.dbar{width:100%;display:flex;flex-direction:column-reverse;border-radius:9px;overflow:hidden}
.dbar i{display:block;background:var(--tc);flex:var(--m) 0 0;min-height:2px}
.dcol b{font-weight:500}
.dcol.now b{color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--tc)}
.wkrow.cur span:first-child{font-weight:700}
.scroll{overflow:auto;min-height:0;flex:1}
@media (min-width:700px){.wkpage>.wk-a,.wkpage>.wk-c{grid-column:span 6}}
@media (min-width:1100px){
  main[data-view="week"]{max-width:none;min-height:calc(100vh - 92px)}
  .dash.wkpage{min-height:0;flex:1;grid-template-rows:minmax(300px,auto) minmax(220px,1fr)}
  .wkpage>.wk-a{grid-column:span 4}.wkpage>.wk-b{grid-column:span 5}.wkpage>.wk-c{grid-column:span 3}
  .wkpage>.wk-d{grid-column:span 8}.wkpage>.wk-e{grid-column:span 4}
}

/* ===== 1.5: Plan page: folder tabs, three-view summary, stage board ===== */
.ftabs{display:flex;gap:4px;align-items:flex-end;padding:0 14px;overflow-x:auto;scrollbar-width:none;margin-bottom:-17px;position:relative;z-index:1}
.ftabs::-webkit-scrollbar{display:none}
.ftab{display:flex;align-items:center;gap:8px;flex:none;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:9px 16px 10px;background:var(--inner);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.ftab svg{color:var(--tc)}
.ftab:hover{color:var(--ink)}
.ftab[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;padding-top:8px;box-shadow:inset 0 3px 0 var(--tc);padding-bottom:12px}
.folder{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0;flex:1}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.psum{display:flex;flex-direction:column;gap:14px;min-width:0}
.psum .stat{background:var(--sunk);border-color:transparent}
.pd2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.nextbox{border:1px solid var(--line);border-radius:15px;padding:15px 16px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--tc) 6%,transparent)}
.sbars{display:flex;flex-direction:column;gap:8px;justify-content:center}
.sbars .wkrow{grid-template-columns:minmax(120px,1.1fr) 2fr 92px}
.road{display:flex;overflow-x:auto;padding:4px 2px 8px}
.step{flex:1 0 176px;position:relative;padding-right:16px;display:flex;flex-direction:column;gap:8px}
.step::before{content:"";position:absolute;top:16px;left:40px;right:4px;height:2px;border-radius:1px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--tc)}
.node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--card);color:var(--muted);position:relative}
.step.done .node{background:var(--tc);border-color:var(--tc);color:var(--card)}
.step.cur .node{border-color:var(--tc);color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 18%,transparent)}
.step b{font-size:14px;line-height:1.25}
.step .bar{max-width:150px}
pre.md{margin:0;font:12.5px/1.6 var(--mono);max-height:340px;overflow:auto;background:var(--sunk);border-radius:13px;padding:14px 16px;white-space:pre-wrap;word-break:break-word}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:8px;min-width:0}
.col{flex:1 0 330px;max-width:520px;min-width:0;border-radius:17px;background:var(--sunk);padding:10px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent}
.col.cur{border-color:color-mix(in srgb,var(--tc) 55%,transparent)}
.col-h{display:flex;flex-direction:column;gap:8px;padding:4px 6px 2px}
.col-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:0;background:none;padding:0;text-align:left;width:100%;color:var(--ink)}
.col-n{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.col.shut{flex:0 0 54px;max-width:54px;align-self:stretch;min-height:150px}
.col.shut .col-t{writing-mode:vertical-rl;justify-content:flex-start;gap:12px;align-items:center;white-space:nowrap}
.col.shut .bar{display:none}
.col details.grp{border-radius:13px;box-shadow:none}
.col details.grp>summary{padding:10px 13px;font-size:13.5px}
.col details.item>summary{padding:9px 13px}
.col .item .acts{padding:4px 13px 12px 13px}
@media (min-width:900px){.pd2{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}}
@media (min-width:1100px){main[data-view="plan"]{max-width:none;min-height:calc(100vh - 92px)}}
@media (max-width:700px){
  .board{flex-direction:column;overflow:visible}
  .col,.col.shut{flex:none;width:100%;max-width:none;min-height:0}
  .col.shut .col-t{writing-mode:horizontal-tb;justify-content:space-between}
  .folder{padding:14px}
  .seg button{padding:6px 9px}
}

/* ===== 1.6: floating top bar, Ideas and Proof pages ===== */
@media (min-width:900px){
  .top{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}
  .top>*{pointer-events:auto}
  .tabs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;box-shadow:var(--shadow)}
  .tabs button{padding:7px 12px}
  .top .ibtn,.top .pill{background:var(--card);box-shadow:var(--shadow)}
  .top .ibtn:hover{border-color:var(--muted)}
  .wkmeta{background:var(--card);border:1px solid var(--line);border-radius:19px;height:38px;padding:0 14px;box-shadow:var(--shadow);margin-right:0}
}
.hsteps{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px;color:var(--muted)}
.hsteps span{display:flex;align-items:center;gap:8px}
.hn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink);font-size:11.5px;font-weight:700}
.ilist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-content:start}
.icard{border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--warn) 6%,transparent);min-width:0}
.icard .row{margin-top:auto}
.icard.q{background:none}
.capbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 28px}
.capbar form{flex:1 1 380px}
.capbar input{padding:12px 14px;font-size:15px}
.idpage>*,.prpage>*{grid-column:span 12}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-content:start}
.pr-b{display:flex;flex-direction:column;gap:16px}
.prow label{color:var(--ink);font-size:14.5px;flex-direction:row;justify-content:space-between;gap:8px}
@media (min-width:1100px){
  main[data-view="ideas"],main[data-view="proof"]{max-width:none;min-height:calc(100vh - 92px)}
  .dash.idpage{min-height:0;flex:1;grid-template-rows:auto minmax(260px,1fr)}
  .idpage>.id-a{grid-column:span 6}.idpage>.id-b,.idpage>.id-c{grid-column:span 3}
  .dash.prpage{min-height:0;grid-template-rows:none}
  .prpage>.pr-a{grid-column:span 8}.prpage>.pr-b{grid-column:span 4}
}
@media (min-width:1100px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayIso = () => iso(new Date());
const monday = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmtDate = (s, o) => parse(s).toLocaleDateString("en-GB", o || { weekday: "short", day: "numeric", month: "short" });
const hrs = m => String(Math.round(m / 6) / 10);
const hnum = h => String(Math.round(h * 10) / 10);
const uid = p => p + "." + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    `<p class="lede">When paid work or life takes over, pause. The weekly target drops to a minimum and every queue stays where it is.</p>
     <form data-form="pause" style="display:flex;flex-direction:column;gap:10px"><label>What for<input type="text" name="reason" id="pz-r" placeholder="e.g. Site supervision job" maxlength="80"></label>
     <div class="grid2"><label>From<input type="date" name="from" id="pz-f" value="${t}" required></label><label>Until<input type="date" name="until" id="pz-u" value="${addDays(t, 13)}" required></label><label>Minimum hours a week<input type="number" name="min" id="pz-m" min="0" max="40" step="0.5" value="${S.settings.pauseMin}"></label></div>
     <div class="row"><button class="btn" type="submit">Start the pause</button></div></form>`) + `</div>`);
  h.push(`<div class="sect"><h2>Weekly split</h2></div><div class="card"><form data-form="settings" style="display:flex;flex-direction:column;gap:10px">
    <div class="grid2">` + SEED.tracks.map(tr => `<label>${esc(tr.name)} (h)<input type="number" name="t_${tr.id}" id="st-${tr.id}" min="0" max="60" step="0.5" value="${tg[tr.id] || 0}"></label>`).join("") + `</div>
    <div class="meta num">Full week: ${hnum(total)} h</div>
    <div class="grid2"><label>Targets start (a Monday)<input type="date" name="start" id="st-start" value="${S.settings.start}"></label><label>Ramp: week 1 total (h)<input type="number" name="r0" id="st-r0" min="0" max="80" step="0.5" value="${S.settings.ramp[0] ?? ""}"></label><label>Ramp: week 2 total (h)<input type="number" name="r1" id="st-r1" min="0" max="80" step="0.5" value="${S.settings.ramp[1] ?? ""}"></label></div>
    <div class="row"><button class="btn" type="submit">Save split</button></div></form></div>`);
  h.push(`<div class="sect"><h2>Backup and moving between devices</h2></div><div class="card">
    <p class="lede">Your data lives on this device only. Export a backup weekly. To bring phone and laptop together, export on one and import with Merge on the other.</p>
    <div class="row"><button class="btn pri" data-act="export">Export backup</button><button class="btn" data-act="export-csv">Export sessions (CSV)</button><button class="btn" data-act="copy-backup">Copy backup as text</button></div>
    <hr><label>Import a backup file<input type="file" id="imp-file" accept=".json,application/json"></label>
    <div class="row"><button class="btn" data-act="import" data-mode="merge">Merge into this device</button><button class="btn quiet danger" data-act="import" data-mode="replace">${UI.armed === "replace" ? "Confirm: replace everything" : "Replace this device's data"}</button></div>
    <div class="meta">${S.lastExport ? "Last export " + fmtDate(iso(new Date(S.lastExport))) : "No export yet"} · stored in: ${esc(DB.mode)} · ${live().length} sessions · version ${VERSION}</div>
    <div class="row"><button class="btn sm" data-act="persist">Ask the browser to protect this data</button></div></div>`);
  h.push(`<div class="sect"><h2>Start over</h2></div><div class="card"><p class="lede">Clears sessions, ideas and edits and reloads the original plan. Export a backup first.</p><div class="row"><button class="btn quiet danger" data-act="reset">${UI.armed === "reset" ? "Confirm: erase and reload the plan" : "Reset this device"}</button></div></div>`);
  return h.join("");
}

const VIEWS = { home: viewHome, track: viewTrack, today: viewToday, week: viewWeek, plan: viewPlan, ideas: viewIdeas, proof: viewProof, more: viewMore };
function render() {
  if (!VIEWS[S.view]) S.view = "home";
  applyTheme();
  renderNav();
  renderAttn();
  $("#main").dataset.view = S.view;
  $("#main").innerHTML = VIEWS[S.view]();
  tick();
}
function tick() {
  const c = $("#clock"), c2 = $("#clock2");
  if (S && S.timer) {
    const s = Math.floor((Date.now() - S.timer.start) / 1000), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    const txt = (hh ? hh + ":" : "") + pad(mm) + ":" + pad(ss);
    if (c) c.textContent = txt; if (c2) c2.textContent = txt; document.title = "● " + txt + " HAMWE";
  } else if (document.title !== "HAMWE") document.title = "HAMWE";
}
setInterval(tick, 1000);

/* ---------- forms ---------- */
const FORMS = {
  capture(d, f) { const text = (d.text || "").trim(); if (!text) return; S.ideas.push(touch({ id: uid("I"), ts: Date.now(), text, st: "parked" })); save(); toast("Parked. Back to the session."); },
  "close-week"(d) { S.reviews[viewWk()] = { ts: Date.now(), note: (d.note || "").trim() }; save(); toast("Week closed"); },
  "add-proof"(d) { S.proofs.push(touch({ id: uid("PR"), tr: d.tr, t: d.t.trim(), done: 0, ev: "" })); save(); },
  "add-crit"(d) { S.criteria.push(touch({ id: uid("CR"), t: d.t.trim(), done: 0 })); save(); },
  pause(d) {
    if (d.until < d.from) { toast("The end date is before the start date."); return; }
    S.pause = { from: d.from, until: d.until, reason: (d.reason || "").trim(), min: Math.max(0, +d.min || 0) }; S.settings.pauseMin = S.pause.min; save(); toast("Paused. Queues are frozen in place.");
  },
  settings(d) {
    for (const tr of SEED.tracks) S.settings.targets[tr.id] = Math.max(0, +d["t_" + tr.id] || 0);
    if (d.start) S.settings.start = monday(d.start);
    S.settings.ramp = [d.r0, d.r1].filter(x => x !== "" && x != null).map(Number).filter(x => x > 0);
    save(); toast("Split saved");
  }
};

/* ---------- actions ---------- */
function arm(key) { if (UI.armed === key) { UI.armed = null; return true; } UI.armed = key; render(); setTimeout(() => { if (UI.armed === key) { UI.armed = null; render(); } }, 4000); return false; }
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function backupText() { const c = JSON.parse(JSON.stringify(S)); c.timer = null; c.format = "unity-backup"; c.exportedAt = new Date().toISOString(); return JSON.stringify(c); }
function mergeById(a, b) { const m = new Map(a.map(x => [x.id, x])); for (const y of b || []) { const x = m.get(y.id); if (!x || (y.u || 0) > (x.u || 0)) m.set(y.id, y); } return [...m.values()]; }
function importData(o, mode) {
  if (!o || !Array.isArray(o.items) || !Array.isArray(o.sessions)) { toast("That file is not a HAMWE backup."); return; }
  if (mode === "replace") { const keepTimer = S.timer; S = o; S.timer = keepTimer; delete S.format; delete S.exportedAt; }
  else {
    for (const k of ["items", "sessions", "ideas", "proofs", "criteria"]) S[k] = mergeById(S[k], o[k]);
    S.reviews = Object.assign({}, o.reviews, S.reviews);
    if ((o.u || 0) > (S.u || 0)) { S.settings = o.settings; S.pause = o.pause; }
  }
  migrate(); save(); render(); toast(mode === "replace" ? "Backup restored" : "Backups merged");
}
function editItemDlg(i) {
  const isNew = !i, trId = isNew ? S.planTrack : i.tr;
  const groups = [...new Set(S.items.filter(x => x.tr === trId).map(x => x.g))];
  openDlg(`<h2>${isNew ? "Add an item to " + esc(track(trId).name) : "Edit item"}</h2>
    <label>Title<input type="text" name="t" id="ei-t" value="${esc(i ? i.t : "")}" required maxlength="200"></label>
    <div class="grid2"><label>Planned hours<input type="number" name="h" id="ei-h" min="0" max="500" step="0.5" value="${i ? i.h : 2}"></label>
    <label>Group<input type="text" name="g" id="ei-g" list="ei-gl" value="${esc(i ? i.g : (groups[0] || "Added"))}" maxlength="80"><datalist id="ei-gl">${groups.map(g => `<option value="${esc(g)}"></option>`).join("")}</datalist></label></div>
    ${isNew ? `<label>Where<select name="pos" id="ei-pos"><option value="end">End of the queue</option><option value="top">Top of the queue (do next)</option></select></label>` : `<label class="check"><input type="checkbox" name="c" id="ei-c"${i.c ? " checked" : ""}> The lesson for this item is written</label>`}
    <label>Note<textarea name="n" id="ei-n">${esc(i ? i.n : "")}</textarea></label>
    <div class="row"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" data-act="dlg-close">Cancel</button>${i && i.id.startsWith("X.") ? `<button class="btn quiet danger" type="button" data-act="item-remove" data-it="${esc(i.id)}">Remove</button>` : ""}</div>`,
    d => {
      if (isNew) {
        const q = S.items.filter(x => x.tr === trId), os = q.map(x => x.o), op = openItems(trId);
        const o = d.pos === "top" ? (op.length ? op[0].o - 5 : 0) : (os.length ? Math.max(...os) + 10 : 10);
        S.items.push(touch({ id: uid("X"), tr: trId, t: d.t.trim(), h: Math.max(0, +d.h || 0), g: (d.g || "Added").trim(), c: 1, src: "", n: (d.n || "").trim(), st: "open", o }));
      } else { i.t = d.t.trim(); i.h = Math.max(0, +d.h || 0); i.g = (d.g || i.g).trim(); i.n = (d.n || "").trim(); i.c = d.c ? 1 : 0; touch(i); }
      save();
    });
}
function ideaDecide(id, kind) {
  const idea = S.ideas.find(x => x.id === id); if (!idea) return;
  const promote = kind === "promote";
  const giveOpts = tr => `<option value="">Choose…</option><option value="__wait">Nothing is dropped: the whole queue waits</option>` + openItems(tr).slice(0, 4).map(i => `<option value="${esc(i.id)}">Set aside: ${esc(i.t.slice(0, 60))}</option>`).join("");
  openDlg(`<h2>${promote ? "Promote this idea" : "Schedule this idea"}</h2><p class="lede">${esc(idea.text)}</p>
    <label>Track<select name="tr" id="id-tr" data-chg="idea-track">${trackOpts("sw")}</select></label>
    <div class="grid2"><label>Planned hours<input type="number" name="h" id="id-h" min="0" max="200" step="0.5" value="2"></label></div>
    ${promote ? `<label>It goes to the top of the queue. What gives way?<select name="gave" id="id-gave" required>${giveOpts("sw")}</select></label>` : `<p class="lede">It joins the end of that queue, so nothing current moves.</p>`}
    <div class="row"><button class="btn pri" type="submit">${promote ? "Promote" : "Schedule"}</button><button class="btn" type="button" data-act="dlg-close">Cancel</button></div>`,
    d => {
      const q = S.items.filter(x => x.tr === d.tr), op = openItems(d.tr);
      const o = promote ? (op.length ? op[0].o - 5 : 0) : (q.length ? Math.max(...q.map(x => x.o)) + 10 : 10);
      S.items.push(touch({ id: uid("X"), tr: d.tr, t: idea.text, h: Math.max(0, +d.h || 0), g: "From ideas", c: 1, src: "", n: "", st: "open", o }));
      idea.st = promote ? "promoted" : "scheduled"; idea.tr = d.tr;
      if (promote && d.gave && d.gave !== "__wait") { const g = item(d.gave); if (g) { g.st = "later"; touch(g); idea.gave = g.t; } }
      else if (promote) idea.gave = "the queue waits";
      touch(idea); save(); toast(promote ? "Promoted to the top" : "Scheduled");
    });
  UI.giveOpts = giveOpts;
}
const ACT = {
  view(el) { if (el.closest("#rail")) $("#rail").classList.add("shut"); S.view = el.dataset.v; save(); render(); toTop(); },
  "dlg-close"() { closeDlg(); },
  start(el) { const tr = el.dataset.tr, it = el.dataset.it; startTimer(tr, it, it ? "" : track(tr).label, false); },
  stop() { closeSessionDlg(); },
  "discard-timer"() { if (UI.armed !== "discard") { UI.armed = "discard"; toast("Press Discard again to throw this session away."); setTimeout(() => UI.armed = null, 4000); return; } UI.armed = null; S.timer = null; save(); closeDlg(); render(); },
  past() { pastSessionDlg(); },
  "off-plan"() {
    openDlg(`<h2>Something not on the plan</h2><p class="lede">Fine to do. Name it so the week shows where the time went. If it can wait, park it instead.</p>
      <label>What is it?<input type="text" name="label" id="op-l" required maxlength="120"></label>
      <label>Closest track<select name="tr" id="op-tr">${trackOpts("sw")}</select></label>
      <div class="row"><button class="btn pri" type="submit" name="go" value="start">Start the session</button><button class="btn" type="submit" name="go" value="park">Park it instead</button><button class="btn quiet" type="button" data-act="dlg-close">Cancel</button></div>`,
      (d, f) => {
        if (d.go === "park") { S.ideas.push(touch({ id: uid("I"), ts: Date.now(), text: d.label.trim(), st: "parked" })); save(); toast("Parked"); }
        else { closeDlg(); startTimer(d.tr, null, d.label.trim(), true); return false; }
      });
  },
  "open-plan"(el) { ACT.track(el); },
  track(el) { if (el.closest("#rail")) $("#rail").classList.add("shut"); S.planTrack = el.dataset.tr; S.view = "track"; UI.touchedG = false; UI.openI = null; save(); render(); toTop(); },
  "wk-nav"(el) { const d = +el.dataset.dir; UI.wkOff = d === 0 ? 0 : Math.max(0, (UI.wkOff || 0) + d); render(); },
  "plan-view"(el) { UI.planView = el.dataset.v; render(); },
  "col-toggle"(el) {
    const k = el.dataset.k, shut = el.getAttribute("aria-expanded") === "false";
    UI.colShut = UI.colShut || new Set(); UI.colOpen = UI.colOpen || new Set();
    if (shut) { UI.colOpen.add(k); UI.colShut.delete(k); } else { UI.colShut.add(k); UI.colOpen.delete(k); }
    render();
  },
  "copy-outline"() { const t = outlineMd(S.planTrack || "sw"); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Outline copied")).catch(() => toast("Copy was blocked by the browser.")); },
  attn() { UI.attn = !UI.attn; render(); },
  "attn-go"(el) { UI.attn = false; if (el.dataset.tr) ACT.track(el); else ACT.view(el); },
  theme() { const o = ["auto", "light", "dark"]; S.settings.theme = o[(o.indexOf(S.settings.theme || "auto") + 1) % 3]; save(); render(); toast("Theme: " + S.settings.theme); },
  "quick-idea"() {
    openDlg(`<h2>Park an idea</h2><label>In one line<input type="text" name="text" id="qi-t" required maxlength="300" autofocus></label>
      <div class="row"><button class="btn pri" type="submit">Park</button><button class="btn" type="button" data-act="dlg-close">Cancel</button></div>`, d => { FORMS.capture(d); });
  },
  "plan-track"(el) { S.planTrack = el.dataset.tr; UI.touchedG = false; UI.openI = null; save(); render(); },
  "add-item"() { editItemDlg(null); },
  "item-edit"(el) { editItemDlg(item(el.dataset.it)); },
  "item-remove"(el) { const i = item(el.dataset.it); if (i) { i.st = "removed"; touch(i); save(); } closeDlg(); render(); },
  "item-done"(el) { const i = item(el.dataset.it); if (!i) return; i.st = "done"; i.doneAt = todayIso(); touch(i); save(); render(); toast("Done. Next item is up."); },
  "item-reopen"(el) { const i = item(el.dataset.it); if (!i) return; i.st = "open"; touch(i); save(); render(); },
  "item-aside"(el) { const i = item(el.dataset.it); if (!i) return; i.st = "later"; touch(i); save(); render(); toast("Set aside. It stays in the plan."); },
  "item-top"(el) { const i = item(el.dataset.it), op = openItems(i.tr); if (op[0] && op[0].id !== i.id) { i.o = op[0].o - 5; touch(i); save(); } render(); toast("Moved to the top"); },
  "item-move"(el) {
    const i = item(el.dataset.it), op = openItems(i.tr), k = op.findIndex(x => x.id === i.id), j = k + (+el.dataset.dir);
    if (k < 0 || j < 0 || j >= op.length) return;
    const o = op[j].o; op[j].o = i.o; i.o = o; touch(i); touch(op[j]); save(); render();
  },
  "idea-promote"(el) { ideaDecide(el.dataset.id, "promote"); },
  "idea-schedule"(el) { ideaDecide(el.dataset.id, "schedule"); },
  "idea-drop"(el) { const i = S.ideas.find(x => x.id === el.dataset.id); i.st = "dropped"; touch(i); save(); render(); },
  "idea-restore"(el) { const i = S.ideas.find(x => x.id === el.dataset.id); i.st = "parked"; touch(i); save(); render(); },
  "crit-del"(el) { const c = S.criteria.find(x => x.id === el.dataset.id); c.del = 1; touch(c); save(); render(); },
  "del-session"(el) { if (!arm(el.dataset.id)) return; const s = S.sessions.find(x => x.id === el.dataset.id); s.del = 1; touch(s); save(); render(); },
  "reopen-week"() { delete S.reviews[viewWk()]; save(); render(); },
  "end-pause"() { if (S.pause) { const p = S.pause, y = addDays(todayIso(), -1); S.pauses.push({ ...p, until: p.until < todayIso() ? p.until : y }); S.pause = null; save(); render(); toast("Full plan resumed"); } },
  export() { download(`unity-backup-${todayIso()}.json`, backupText(), "application/json"); S.lastExport = Date.now(); save(); render(); },
  "export-csv"() {
    const rows = [["event_id", "type", "ref_id", "track", "title", "date", "hours", "ai_mode", "off_plan", "note"]];
    live().slice().sort((a, b) => a.ts - b.ts).forEach((s, n) => rows.push(["UNI.EVT-" + String(n + 1).padStart(6, "0"), "study_session", s.it || "", s.tr, sessionLabel(s), s.d, (s.m / 60).toFixed(2), s.mode ?? "", s.off ? "yes" : "", s.note || ""]));
    download(`unity-sessions-${todayIso()}.csv`, rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
  },
  "copy-backup"() { const t = backupText(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Backup copied")).catch(() => toast("Copy was blocked. Use Export backup.")); },
  import(el) {
    const f = $("#imp-file").files[0], mode = el.dataset.mode; if (!f) { toast("Choose a backup file first."); return; }
    if (mode === "replace" && !arm("replace")) return;
    const r = new FileReader(); r.onload = () => { try { importData(JSON.parse(r.result), mode); } catch (e) { toast("That file could not be read."); } }; r.readAsText(f);
  },
  persist() { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => toast(ok ? "The browser will keep this data." : "Not granted. Install the app, and keep exporting backups.")); else toast("Not supported in this browser."); },
  reset() { if (!arm("reset")) return; S = fresh(); save(); render(); toast("Plan reloaded"); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el) return; const fn = ACT[el.dataset.act]; if (fn) { if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault(); fn(el, e); } });
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset && el.dataset.chg; if (!k) return;
  if (k === "show-done") { UI.showDone = el.checked; render(); }
  else if (k === "past-track") { $("#p-it").innerHTML = itemOpts(el.value); }
  else if (k === "idea-track") { const g = $("#id-gave"); if (g && UI.giveOpts) g.innerHTML = UI.giveOpts(el.value); }
  else if (k === "proof-done") { const p = S.proofs.find(x => x.id === el.dataset.id); p.done = el.checked ? 1 : 0; touch(p); save(); render(); }
  else if (k === "proof-ev") { const p = S.proofs.find(x => x.id === el.dataset.id); p.ev = el.value.trim(); touch(p); save(); }
  else if (k === "crit-done") { const c = S.criteria.find(x => x.id === el.dataset.id); c.done = el.checked ? 1 : 0; touch(c); save(); render(); }
});
document.addEventListener("toggle", e => {
  const el = e.target; if (!el.matches) return;
  if (el.matches("details.grp")) { const k = el.dataset.g; if (el.open === UI.openG.has(k)) return; UI.touchedG = true; el.open ? UI.openG.add(k) : UI.openG.delete(k); render(); }
  else if (el.matches("details.item")) { const id = el.dataset.i; if (el.open && UI.openI !== id) { UI.openI = id; render(); } else if (!el.open && UI.openI === id) { UI.openI = null; render(); } }
}, true);
$("#dlg").addEventListener("cancel", () => { dlgSubmit = null; });
$("#rail").addEventListener("mouseleave", () => $("#rail").classList.remove("shut"));
document.addEventListener("visibilitychange", () => { if (document.hidden && S) { clearTimeout(saveT); DB.put(S); } else if (S) render(); });

/* ---------- boot ---------- */
(async function boot() {
  await DB.open();
  const prev = await DB.get();
  S = prev && Array.isArray(prev.items) ? prev : fresh();
  if (!prev) DB.put(S);
  // New seed items added in a later version are appended without touching existing data.
  migrate();
  const have = new Set(S.items.map(i => i.id));
  for (const x of SEED.items) if (!have.has(x.id)) S.items.push({ ...x, u: 0 });
  for (const tr of SEED.tracks) if (!(tr.id in S.settings.targets)) S.settings.targets[tr.id] = tr.target;
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
